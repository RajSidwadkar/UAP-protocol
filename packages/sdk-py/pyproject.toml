[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uap-sdk"
version = "0.1.0"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.7.0",
    "fastapi==0.111.0",
    "python-ulid==2.0.0"
]
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "function"

